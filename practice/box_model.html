<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Box Model</title>
    <script src="../validate.js"></script> 
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <style>
      #Cherry {
        background-color:red;
        height:100px;
        width:100px; 
        border:2px black solid;
        background-clip:content-box;
        margin-left:200px; }
      #Blueberry {
        background-color:blue;
        height:100px;
        width:100px;
        border:2px black solid;
        padding:100px;
        background-clip:content-box;
        margin-left:300px;}
    #GreenApple {
      background-color:green;
      height:100px;
      width:100px;
      border:2px black solid;
      padding-left:20px;
      background-clip:content-box; }
    #Lemon {
      background-color:lemonchiffon; 
      height:100px;
      width:100px;
      border:2px black solid;
      background-clip:content-box;
      padding-left:15px;
      padding-right:15px;
      padding-top:25px;
      margin-left:200px; }
    #Grape {
      background-color:purple;
      height:100px;
      width:100px;
      border:2px black solid;
      background-clip:content-box;
      padding-bottom:100px;
      margin-left:100px;}
    </style>
  </head>
  <body>
    <h1>Look at the boxes!</h1>
    <div id="Cherry"></div>
    <div id="Blueberry"></div>
    <div id="GreenApple"></div>
    <div id="Lemon"></div>
    <div id="Grape"></div>
  </body>
</html>
